<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Arcana Quest — ไพ่ทาโรต์ 78 ใบ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="minor-style.css">
</head>
<body>
<div id="app">

  <!-- ═══════════════════════════════
       HOME SCREEN
  ═══════════════════════════════ -->
  <div class="screen active" id="screen-home">
    <div class="home-scroll">
      <div class="home-hero">
        <span class="home-star">✦</span>
        <h1 class="home-title">Arcana Quest</h1>
        <p class="home-sub">ไพ่ทาโรต์ 78 ใบ — Major & Minor Arcana</p>
      </div>

      <!-- Stats bar -->
      <div class="stats-bar">
        <div class="stat-box">
          <span class="stat-val" id="stat-xp">0</span>
          <span class="stat-lbl">XP</span>
        </div>
        <div class="stat-box">
          <span class="stat-val" id="stat-badge">—</span>
          <span class="stat-lbl">Badge</span>
        </div>
        <div class="stat-box">
          <span class="stat-val" id="stat-streak">0 🌱</span>
          <span class="stat-lbl">Streak</span>
        </div>
      </div>

      <!-- Progress 78 -->
      <div id="progress-78" style="margin:0 16px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-bottom:12px">
          <div>
            <div style="font-family:'Cinzel',serif;font-size:1rem;color:var(--gold2)" id="prog-major-count">0</div>
            <div style="font-size:.7rem;color:var(--text2)">Major 22</div>
          </div>
          <div>
            <div style="font-family:'Cinzel',serif;font-size:1rem;color:var(--accent2)" id="prog-minor-count">0</div>
            <div style="font-size:.7rem;color:var(--text2)">Minor 56</div>
          </div>
          <div>
            <div style="font-family:'Cinzel',serif;font-size:1rem;color:var(--success)" id="prog-total-count">0</div>
            <div style="font-size:.7rem;color:var(--text2)">Total 78</div>
          </div>
        </div>
        <div style="height:6px;background:var(--bg3);border-radius:3px;overflow:hidden">
          <div id="prog-total-bar" style="height:100%;width:0%;background:linear-gradient(90deg,var(--gold-dim),var(--success));transition:width .5s;border-radius:3px"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:6px">
          <button onclick="goLibrary()" style="background:none;border:1px solid var(--border);color:var(--gold);padding:3px 10px;border-radius:20px;font-size:.72rem;cursor:pointer;font-family:'Cinzel',serif">📚 Library 78 ใบ</button>
          <button onclick="goReadingLab()" style="background:none;border:1px solid var(--border);color:var(--accent2);padding:3px 10px;border-radius:20px;font-size:.72rem;cursor:pointer;font-family:'Cinzel',serif">🃏 Reading Lab</button>
        </div>
      </div>

      <!-- Tab panes -->
      <div class="tab-pane active" data-tab="journey">
        <div class="journey-grid" id="journey-grid"></div>
      </div>
      <div class="tab-pane" data-tab="practice">
        <div id="practice-content" style="padding-bottom:24px"></div>
      </div>
      <div class="tab-pane" data-tab="journal">
        <div class="journal-header">
          <h2>📖 สมุดบันทึก</h2>
          <p style="font-size:.82rem;color:var(--text2);margin-top:4px">Reflections จากการเรียนรู้ของคุณ</p>
        </div>
        <div class="journal-list" id="journal-entries"></div>
      </div>
      <div class="tab-pane" data-tab="awards">
        <div class="section-title">Badges & Achievements</div>
        <div class="award-list" id="awards-list"></div>
        <div style="padding:8px 16px 24px;text-align:center">
          <button class="btn-outline" onclick="resetData()" style="font-size:.75rem;opacity:.5">รีเซ็ตข้อมูล</button>
        </div>
      </div>
    </div>

    <!-- Tab nav -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="journey"><span class="t-icon">🗺</span>เส้นทาง</button>
      <button class="tab-btn" data-tab="practice"><span class="t-icon">🎯</span>ฝึกสอบ</button>
      <button class="tab-btn" data-tab="journal"><span class="t-icon">📖</span>บันทึก</button>
      <button class="tab-btn" data-tab="awards"><span class="t-icon">🏅</span>รางวัล</button>
    </nav>
  </div>

  <!-- ═══════════════════════════════
       CHAPTER SCREEN (Major)
  ═══════════════════════════════ -->
  <div class="screen" id="screen-chapter">
    <div class="ch-top-bar">
      <button class="ch-back" onclick="goHome()">←</button>
      <div class="ch-title-wrap">
        <div class="ch-title-en" id="ch-title-en">—</div>
        <div class="ch-title-th" id="ch-title-th">—</div>
      </div>
      <div class="ch-num-badge" id="ch-num">—</div>
    </div>
    <div class="ch-tabs" id="ch-tabs"></div>
    <div class="ch-body" id="ch-body"></div>
  </div>

  <!-- ═══════════════════════════════
       EXAM SCREEN
  ═══════════════════════════════ -->
  <div class="screen" id="screen-exam"></div>

  <!-- ═══════════════════════════════
       READING LAB SCREEN (upgraded)
  ═══════════════════════════════ -->
  <div class="screen" id="screen-reading"></div>

  <!-- ═══════════════════════════════
       MINOR SUIT SCREEN
  ═══════════════════════════════ -->
  <div class="screen" id="screen-minor-suit"></div>

  <!-- ═══════════════════════════════
       MINOR CARD DETAIL SCREEN
  ═══════════════════════════════ -->
  <div class="screen" id="screen-minor-card">
    <div class="ch-top-bar">
      <button class="ch-back" id="minor-card-back" onclick="if(currentMinorSuit)goMinorSuit(currentMinorSuit);else goHome()">←</button>
      <div class="ch-title-wrap">
        <div class="ch-title-en" id="mc-title-en">—</div>
        <div class="ch-title-th" id="mc-title-th">—</div>
      </div>
      <div class="ch-num-badge" id="mc-suit-badge">—</div>
    </div>
    <div class="ch-tabs" id="minor-card-tabs"></div>
    <div class="ch-body" id="minor-card-body"></div>
  </div>

  <!-- ═══════════════════════════════
       CARD LIBRARY SCREEN
  ═══════════════════════════════ -->
  <div class="screen" id="screen-library"></div>

  <!-- ═══════════════════════════════
       MINOR QUIZ SCREEN
  ═══════════════════════════════ -->
  <div class="screen" id="screen-minor-quiz"></div>

</div>

<!-- ── JS: Load order matters ── -->
<script src="chapters.js?v=20260606"></script>
<script src="minor-data.js?v=20260606b"></script>
<script src="app.js?v=20260606"></script>
<script src="chapter.js?v=20260606"></script>
<script src="exam.js?v=20260606"></script>
<script src="minor-ui.js?v=20260606b"></script>

<script>
// ── Init & tab binding ──────────────────────────────
function initAppFull() {
  // Tab buttons
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      STATE.activeTab = btn.dataset.tab;
      saveState();
      renderHomeScreen();
    });
  });

  updateStreak();
  renderHomeScreen();
  renderProgressBar();
  checkBadges();
  checkMinorBadges();
}

function renderProgressBar() {
  var done = (typeof completedCount === 'function') ? completedCount() : 0;
  var minorDone = (typeof getMinorTotalViewed === 'function') ? getMinorTotalViewed() : 0;
  var total = done + minorDone;
  var pct = Math.round(total / 78 * 100);

  var el = document.getElementById('prog-major-count');
  if (el) el.textContent = done;
  el = document.getElementById('prog-minor-count');
  if (el) el.textContent = minorDone;
  el = document.getElementById('prog-total-count');
  if (el) el.textContent = total;
  el = document.getElementById('prog-total-bar');
  if (el) el.style.width = pct + '%';
}

// Patch renderHomeScreen to update progress bar too
var _origRenderHome = renderHomeScreen;
window.renderHomeScreen = function() {
  _origRenderHome();
  renderProgressBar();

  // Render correct tab content
  var tab = STATE.activeTab || 'journey';
  document.querySelectorAll('.tab-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  document.querySelectorAll('.tab-pane').forEach(function(p) {
    p.classList.toggle('active', p.dataset.tab === tab);
  });

  if (tab === 'journey') {
    if (typeof renderJourneyGrid === 'function') renderJourneyGrid();
  }
  if (tab === 'practice') {
    if (typeof renderPracticeTab === 'function') renderPracticeTab();
  }
  if (tab === 'journal') {
    if (typeof renderJournal === 'function') renderJournal();
  }
  if (tab === 'awards') {
    if (typeof renderAwards === 'function') renderAwards();
  }
};

// Also patch goReadingLab to use new version
window.goReadingLab = function() {
  showScreen('screen-reading');
  if (typeof renderReadingLab === 'function') renderReadingLab();
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initAppFull);
} else {
  initAppFull();
}

// Fallback safety
setTimeout(function() {
  var grid = document.getElementById('journey-grid');
  if (grid && grid.innerHTML.trim() === '') {
    initAppFull();
  }
}, 1200);
</script>
</body>
</html>
